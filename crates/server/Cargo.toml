[package]
name = "server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "hash-password"
path = "src/bin/hash_password.rs"

[dependencies]
nutrition-core = { path = "../core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
# Pinned to 0.14: tower-sessions-sqlx-store 0.15 depends on tower-sessions-core
# ^0.14, and tower-sessions itself pins tower-sessions-core with `=`, so
# tower-sessions 0.15 and tower-sessions-sqlx-store 0.15 cannot coexist.
tower-sessions = { version = "=0.14.0", default-features = false, features = ["axum-core", "signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8", "tracing-0.1"] }

argon2 = "0.6"
chrono-tz = "0.10"
time = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
